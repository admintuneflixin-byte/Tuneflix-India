<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tuneflix Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--black:#080808;--ink:#111114;--muted:#71717a;--bg:#f4f4f6;--line:#e4e4e7;--white:#fff;--green:#15803d;--greenbg:#dcfce7;--amber:#a16207;--amberbg:#fef3c7;--red:#b91c1c;--redbg:#fee2e2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#f4f4f5}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:0 20px 60px #0000000d}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.brand small{display:block;font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:500}.field{display:grid;gap:7px;margin:16px 0}.field label{font-size:12px;color:#52525b;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;font:inherit;outline:none}.field input:focus,.field textarea:focus{border-color:#111;box-shadow:0 0 0 3px #0000000b}
.btn{border:0;background:var(--black);color:#fff;padding:12px 17px;border-radius:10px;font-weight:700;cursor:pointer}.btn.light{background:#f1f1f3;color:#111}.btn.outline{background:#fff;color:#111;border:1px solid var(--line)}.btn:disabled{opacity:.5;cursor:not-allowed}
.layout{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:224px;background:#080808;color:#fff;padding:22px 14px;display:flex;flex-direction:column;z-index:5}.logo{padding:4px 12px 28px;font-size:24px;font-weight:800}.logo span{display:block;font-size:10px;color:#aaa;letter-spacing:1px;font-weight:500}.nav{display:grid;gap:5px}.nav button{border:0;text-align:left;color:#d4d4d8;background:transparent;padding:13px 14px;border-radius:11px;font:600 13px Inter;cursor:pointer}.nav button.active,.nav button:hover{background:#292929;color:#fff}.sidebottom{margin-top:auto;border:1px solid #333;border-radius:14px;padding:15px;color:#ddd;font-size:12px;line-height:1.6}
.main{margin-left:224px;min-height:100vh}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:3}.top input{width:min(480px,55vw);padding:12px 16px;border:0;background:#f1f1f4;border-radius:25px;font:inherit}.profile{font-size:13px;font-weight:700}.content{padding:26px;max-width:1600px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.welcome h1{font-size:25px;margin:0 0 5px;letter-spacing:-.8px}.muted{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 4px 14px #00000006}.stat{padding:17px;min-height:120px}.stat .label{font-size:12px;color:#52525b;font-weight:700}.stat .num{font-size:30px;font-weight:800;margin-top:12px;letter-spacing:-1px}.iconbox{width:38px;height:38px;border-radius:11px;background:#080808;color:white;display:grid;place-items:center;margin-bottom:12px;font-size:18px}
.gridmain{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;margin-top:14px}.panel{padding:19px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.panel h2{font-size:16px;margin:0}.banner{background:#080808;color:#fff;border-radius:17px;padding:25px;min-height:190px;display:flex;flex-direction:column;justify-content:center}.banner h2{font-size:25px;max-width:300px;margin:0 0 10px}.banner p{color:#ccc;font-size:13px}.banner .btn{background:#fff;color:#111;align-self:flex-start}
.lower{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px;min-width:520px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#f4f4f5;color:#52525b;font-size:11px;text-transform:uppercase;letter-spacing:.5px}.pill{display:inline-block;padding:6px 10px;border-radius:20px;font-weight:700;font-size:10px}.approved{background:var(--greenbg);color:var(--green)}.pending{background:var(--amberbg);color:var(--amber)}.rejected{background:var(--redbg);color:var(--red)}
.actions{display:grid;gap:8px}.actions button{width:100%;text-align:left}.section{margin-top:16px}.section .card{padding:20px}.section h2{margin:0 0 16px;font-size:18px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{padding:10px;border:1px solid var(--line);border-radius:9px;background:white}.toast{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:12px 16px;border-radius:10px;z-index:20;font-size:13px}.mobilemenu{display:none}
@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}.gridmain,.lower{grid-template-columns:1fr}}
@media(max-width:700px){.sidebar{width:76px;padding:15px 8px}.logo{font-size:0;padding:8px 4px 22px}.logo:after{content:"T";font-size:24px}.logo span{display:none}.nav button{font-size:0;text-align:center;padding:14px 4px}.nav button::first-letter{font-size:17px}.sidebottom{display:none}.main{margin-left:76px}.top{padding:0 12px;height:60px}.top input{width:52vw}.profile{font-size:11px}.content{padding:15px 11px}.welcome h1{font-size:20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{padding:13px;min-height:105px}.stat .num{font-size:25px}.gridmain,.lower{gap:9px}.panel{padding:14px}.banner{min-height:160px}.banner h2{font-size:21px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><div class="brand">♫ Tuneflix<small>MUSIC DISTRIBUTION ADMIN</small></div><h2>Welcome back</h2><p class="muted">Sign in to manage your distribution platform.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" style="width:100%">Sign in</button></form><p id="loginError" class="muted"></p></div></div>
<div id="app" class="layout hidden">
<aside class="sidebar"><div class="logo">♫ Tuneflix<span>MUSIC DISTRIBUTION</span></div><nav class="nav">
<button class="active" data-page="dashboard">⌂　Dashboard</button><button data-page="users">♙　Artists / Users</button><button data-page="labels">▤　Labels</button><button data-page="releases">♫　Releases</button><button data-page="wallet">₹　Payments / Wallet</button><button data-page="support">☏　Support</button><button data-page="notifications">♧　Notifications</button><button id="logout">⇥　Logout</button></nav><div class="sidebottom">BLACK & WHITE EDITION<br>Manage artists, releases and operations from one place.</div></aside>
<main class="main"><header class="top"><input id="search" placeholder="Search artists, releases..."><div class="profile" id="profile">ADMIN　⌄</div></header><div class="content">
<div class="welcome"><div><h1 id="pageTitle">Welcome back!</h1><div class="muted" id="pageSubtitle">Here’s what’s happening with your Tuneflix account.</div></div><button class="btn outline" id="refresh">↻ Refresh</button></div>
<div id="page"></div>
</div></main></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);let token=localStorage.getItem("tf_token"),me=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,opts={}){const r=await fetch("/api"+url,{...opts,headers:{"Content-Type":"application/json",...(opts.headers||{}),...(token?{Authorization:"Bearer "+token}:{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"Request failed");return d}
function toast(t){$("#toast").textContent=t;$("#toast").classList.remove("hidden");setTimeout(()=>$("#toast").classList.add("hidden"),2800)}
function showLogin(){ $("#login").classList.remove("hidden");$("#app").classList.add("hidden"); }
function showApp(){ $("#login").classList.add("hidden");$("#app").classList.remove("hidden");$("#profile").textContent=(me?.name||"Admin")+"　⌄";loadPage("dashboard");}
$("#loginForm").onsubmit=async e=>{e.preventDefault();$("#loginError").textContent="Signing in...";try{const d=await api("/auth/login",{method:"POST",body:JSON.stringify({email:$("#email").value,password:$("#password").value})});token=d.token;localStorage.setItem("tf_token",token);me=d.user;showApp()}catch(err){$("#loginError").textContent=err.message}};
$("#logout").onclick=()=>{localStorage.removeItem("tf_token");token=null;showLogin()};
$("#refresh").onclick=()=>loadPage(document.querySelector(".nav .active")?.dataset.page||"dashboard");
document.querySelectorAll(".nav [data-page]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");loadPage(b.dataset.page)});
function stat(label,num,icon){return `<div class="card stat"><div class="iconbox">${icon}</div><div class="label">${label}</div><div class="num">${num}</div></div>`}
function status(s){return `<span class="pill ${s==='approved'?'approved':s==='rejected'?'rejected':'pending'}">${esc(s||'pending').toUpperCase()}</span>`}
async function loadPage(p){$("#pageTitle").textContent=p==="dashboard"?"Welcome back, "+(me?.name||"Admin")+"!":p[0].toUpperCase()+p.slice(1);$("#pageSubtitle").textContent="Tuneflix Music Distribution · Admin Workspace";try{
if(p==="dashboard"){const d=await api("/dashboard");$("#page").innerHTML=`<div class="stats">${stat("Pending Approvals",d.stats.pending,"♙")}${stat("Total Users",d.stats.users,"♟")}${stat("Releases",d.stats.releases,"♫")}${stat("Open Requests",d.stats.requests,"☏")}${stat("Total Credits","₹"+Number(d.stats.earnings).toLocaleString("en-IN"),"₹")}</div><div class="gridmain"><div class="card panel"><div class="panelhead"><h2>Overview Analytics</h2><span class="muted">Live database totals</span></div><div style="display:flex;gap:25px;flex-wrap:wrap;padding:18px 0"><b>Users　${d.stats.users}</b><b>Releases　${d.stats.releases}</b><b>Pending　${d.stats.pending}</b></div><div style="height:9px;background:#eee;border-radius:20px;overflow:hidden"><div style="height:100%;width:${Math.min(100,d.stats.users?d.stats.releases/d.stats.users*100:0)}%;background:#111"></div></div><p class="muted">Release-to-user ratio (illustrative summary; connect streaming reports for real stream analytics).</p></div><div class="banner"><h2>Distribute Your Music Globally</h2><p>Manage releases, artists and label operations from one dashboard.</p><button class="btn" onclick="loadPage('releases')">View Releases →</button></div></div><div class="lower"><div class="card panel"><div class="panelhead"><h2>Recent Releases</h2><button class="btn outline" onclick="loadPage('releases')">View all</button></div>${table(["Title","Artist","Status"],d.recentReleases.map(x=>[esc(x.title),esc(x.artist),status(x.status)]))}</div><div class="card panel"><h2>Quick Actions</h2><div class="actions"><button class="btn" onclick="loadPage('users')">Manage Artists / Users</button><button class="btn" onclick="loadPage('releases')">Review Releases</button><button class="btn" onclick="loadPage('labels')">Create Label</button><button class="btn" onclick="loadPage('wallet')">Wallet Transactions</button></div></div></div>`}
else if(p==="users"){const d=await api("/users");$("#page").innerHTML=`<div class="section card"><h2>Artists & User Applications</h2>${table(["Name","Email","Role","Joined","Status","Action"],d.map(u=>[esc(u.name),esc(u.email),esc(u.role),new Date(u.created_at).toLocaleDateString(),status(u.status),u.status==="pending"?`<button class="btn" onclick="userStatus(${u.id},'approved')">Approve</button> <button class="btn light" onclick="userStatus(${u.id},'rejected')">Reject</button>`:"—"]))}</div>`}
else if(p==="labels"){const d=await api("/labels");$("#page").innerHTML=`<div class="section card"><h2>Labels Management</h2><form id="labelForm" class="toolbar"><input name="name" placeholder="Label name" required><input name="email" type="email" placeholder="Contact email"><button class="btn">+ Create Label</button></form>${table(["Label","Email","Status","Created"],d.map(x=>[esc(x.name),esc(x.email),esc(x.status),new Date(x.created_at).toLocaleDateString()]))}</div>`;$("#labelForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api("/labels",{method:"POST",body:JSON.stringify({name:f.get("name"),email:f.get("email")})});toast("Label created");loadPage("labels")}}
else if(p==="releases"){const d=await api("/releases");$("#page").innerHTML=`<div class="section card"><h2>Release Management</h2><form id="releaseForm" class="toolbar" enctype="multipart/form-data"><input name="title" placeholder="Release title" required><input name="artist" placeholder="Artist name" required><input name="label" placeholder="Label"><input name="release_date" type="date"><input name="audio" type="file" accept="audio/*"><input name="cover" type="file" accept="image/*"><button class="btn">Submit Release</button></form>${table(["Title","Artist","Label","Date","Status","Action"],d.map(x=>[esc(x.title),esc(x.artist),esc(x.label),esc(x.release_date),status(x.status),x.status==="pending"?`<button class="btn" onclick="releaseStatus(${x.id},'approved')">Approve</button> <button class="btn light" onclick="releaseStatus(${x.id},'rejected')">Reject</button>`:"—"]))}</div>`;$("#releaseForm").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const r=await fetch("/api/releases",{method:"POST",headers:{Authorization:"Bearer "+token},body:fd});const x=await r.json();if(!r.ok)throw Error(x.error);toast("Release submitted");loadPage("releases")}}
else if(p==="wallet"){const d=await api("/wallet/transactions");$("#page").innerHTML=`<div class="section card"><h2>Payments & Wallet Ledger</h2><form id="walletForm" class="toolbar"><input name="user_id" type="number" placeholder="User ID (optional)"><input name="amount" type="number" min="0.01" step="0.01" placeholder="Amount ₹" required><select name="type"><option value="credit">Credit</option><option value="debit">Debit</option></select><input name="note" placeholder="Note"><button class="btn">Add Transaction</button></form>${table(["User","Amount","Type","Note","Status","Date"],d.map(x=>[esc(x.name||"—"),"₹"+esc(x.amount),esc(x.type),esc(x.note),esc(x.status),new Date(x.created_at).toLocaleDateString()]))}</div>`;$("#walletForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api("/wallet/transactions",{method:"POST",body:JSON.stringify(Object.fromEntries(f))});toast("Transaction added");loadPage("wallet")}}
else if(p==="support"){const d=await api("/support");$("#page").innerHTML=`<div class="section card"><h2>Support Requests</h2>${table(["Subject","User","Message","Status","Date"],d.map(x=>[esc(x.subject),esc(x.name||"—"),esc(x.message),esc(x.status),new Date(x.created_at).toLocaleDateString()]))}</div>`}
else if(p==="notifications"){const d=await api("/notifications");$("#page").innerHTML=`<div class="section card"><h2>Notifications</h2><form id="noticeForm" class="toolbar"><input name="title" placeholder="Notification title" required><input name="message" placeholder="Message" required><button class="btn">Send Notification</button></form>${table(["Title","Message","Created"],d.map(x=>[esc(x.title),esc(x.message),new Date(x.created_at).toLocaleString()]))}</div>`;$("#noticeForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api("/notifications",{method:"POST",body:JSON.stringify(Object.fromEntries(f))});toast("Notification created");loadPage("notifications")}}
}catch(e){$("#page").innerHTML=`<div class="card panel"><b>Could not load this section</b><p class="muted">${esc(e.message)}</p></div>`}}
function table(headers,rows){if(!rows.length)return `<p class="muted">No records found yet.</p>`;return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
async function userStatus(id,status){try{await api(`/users/${id}/status`,{method:"PATCH",body:JSON.stringify({status})});toast("User updated");loadPage("users")}catch(e){toast(e.message)}}
async function releaseStatus(id,status){try{await api(`/releases/${id}/status`,{method:"PATCH",body:JSON.stringify({status})});toast("Release updated");loadPage("releases")}catch(e){toast(e.message)}}
async function boot(){if(!token)return showLogin();try{const d=await api("/auth/me");me=d.user;if(me.role!=="admin")throw Error("Admin access required");showApp()}catch{localStorage.removeItem("tf_token");token=null;showLogin()}}
boot();
</script>
</body></html>
